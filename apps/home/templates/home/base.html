<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}運動管理アプリ{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('home.static', filename='style/sidebar.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>

    {% if session.get("username") %}

    <!-- サイドバー開閉ボタン -->
    <button id="sidebar-toggle" onclick="toggleSidebar()">
        ☰
    </button>

    {% endif %}

    <div class="layout sidebar-closed {% if not session.get('username') %}no-sidebar{% endif %}">
        {% if session.get("username") %}

        <!-- サイドバー -->
        <aside class="sidebar">
            <h2>MENU</h2>

            <nav>
                <a href="{{ url_for('home.index') }}">ホーム</a>
                <!-- <a href="{{ url_for('home.register') }}">新規作成</a> -->
                <a href="{{ url_for('home.history') }}">履歴機能</a>
                <a href="{{ url_for('friend.index') }}">フレンド</a>
                <a href="{{ url_for('home.help') }}">ヘルプ・使い方</a>
                <a href="{{ url_for('register.delete_account') }}">アカウント削除</a>
            </nav>

            <div class="logout">
                <a href="{{ url_for('login.logout') }}">ログアウト</a>

                <div class="sidebar-user">
                    <div class="user-icon">
                        🙍
                    </div>

                    <div class="user-info">
                        <span>ログイン中</span>
                        <p>{{ session["username"] }}</p>
                    </div>
                </div>
            </div>
        </aside>

        {% endif %}

        <!-- メイン画面 -->
        <main class="main-content">
            {% block content %}
            {% endblock %}

            <!-- <div class="back">
                <a href="{{ url_for('home.index') }}"
                    onclick="if (document.referrer && new URL(document.referrer).origin === location.origin) { history.back(); return false; }">
                    ← トップページへ戻る
                </a>

                {% block back_link %}{% endblock %}
            </div> -->
        </main>
    </div>

    <script>

        document.addEventListener("DOMContentLoaded", function () {
            const layout = document.querySelector(".layout");

            if (!layout || layout.classList.contains("no-sidebar")) {
                return;
            }

            // ページを開いたときは必ず閉じる
            layout.classList.add("sidebar-closed");
            localStorage.setItem("sidebarClosed", "true");
        });

        // サイドバー開閉
        function toggleSidebar() {
            const layout = document.querySelector(".layout");

            if (!layout) return;

            layout.classList.toggle("sidebar-closed");

            const isClosed = layout.classList.contains("sidebar-closed");

            localStorage.setItem("sidebarClosed", isClosed);
        }

        // オンライン状態の定期更新
        document.addEventListener("DOMContentLoaded", function () {
            const heartbeatUrl = "{{ url_for('login.heartbeat') }}";

            function updateOnlineStatus() {
                if (document.visibilityState !== "visible") {
                    return;
                }

                fetch(heartbeatUrl, {
                    method: "POST",
                    credentials: "same-origin"
                }).catch(error => {
                    console.error("オンライン状態の更新に失敗しました:", error);
                });
            }

            // ページを開いたときに更新
            updateOnlineStatus();

            // 30秒ごとに更新
            setInterval(updateOnlineStatus, 30000);
        });

    </script>

</body>


</html>
