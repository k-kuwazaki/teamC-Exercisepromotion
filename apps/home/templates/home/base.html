<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}運動管理アプリ{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('home.static', filename='style/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('home.static', filename='style/login.css') }}">

</head>


<body>

    {% if session.get("username") %}

    <!-- サイドバー開閉ボタン -->
    <button id="sidebar-toggle" onclick="toggleSidebar()">
        ☰
    </button>

    {% endif %}

    <div class="layout {% if not session.get('username') %}no-sidebar{% endif %}">

        {% if session.get("username") %}

        <!-- サイドバー -->
        <aside class="sidebar">
            <h2>Sidebar</h2>

            <nav>
                <a href="{{ url_for('home.index') }}">ホーム</a>
                <a href="{{ url_for('home.register') }}">新規作成</a>
                <a href="{{ url_for('home.history') }}">履歴機能</a>
                <a href="{{ url_for('friend.index') }}">フレンド</a>
                <a href="{{ url_for('home.help') }}">ヘルプ・使い方</a>
                <a href="{{ url_for('register.delete_account') }}">アカウント削除</a>
            </nav>

            <div class="logout">
                <a href="{{ url_for('login.logout') }}">ログアウト</a>

                <div class="sidebar-user">
                    <div class="user-icon">
                        🙍
                    </div>

                    <div class="user-info">
                        <span>ログイン中</span>
                        <p>{{ session["username"] }}</p>
                    </div>
                </div>
            </div>
        </aside>

        {% endif %}

        <!-- メイン画面 -->
        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>

    </div>

    <div class="back">
        {% block back_link %}
        <a href="{{ url_for('home.index') }}">← トップページに戻る</a>
        {% endblock %}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const layout = document.querySelector(".layout");

            if (layout && !layout.classList.contains("no-sidebar")) {
                layout.classList.add("sidebar-closed");
                localStorage.setItem("sidebarClosed", "true");
            }
        });

        function toggleSidebar() {
            const layout = document.querySelector(".layout");

            if (!layout) return;

            layout.classList.toggle("sidebar-closed");

            const isClosed = layout.classList.contains("sidebar-closed");
            localStorage.setItem("sidebarClosed", isClosed);
        }
    </script>

</body>


</html>
