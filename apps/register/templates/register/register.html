{% extends "home/base.html" %}
{% block content %}

<link rel="stylesheet" href="{{ url_for('register.static', filename='style/register.css') }}">


<h1>ユーザー登録</h1>
<form method="post" action="{{ url_for('register.register') }}">

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
    
    <div>
        <label for="name">名前</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div>
        <label for="height">身長</label>
        <input type="number" id="height" name="height" step="any" min="0" required>
    </div>

    <div>
        <label for="weight">体重</label>
        <input type="number" id="weight" name="weight" step="any" min="0" required>
    </div>

    <div>
        <label for="birthday">生年月日</label>
        <input type="date" id="birthday" name="birthday" required>
    </div>

    <div>
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div>
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" required>
    </div>

    <div>
        <label for="exercise_habit">運動習慣</label>
        <select id="exercise_habit" name="exercise_habit">
            <option value="" disabled selected>選択してください</option>
            <option value="rarely">ほとんどしない</option>
            <option value="sometimes">週に1〜2回</option>
            <option value="often">週に3回以上</option>
        </select>
    </div>

    <div>
        <label for="goal">目標</label>
        <textarea id="goal" name="goal"></textarea>
    </div>

    <button type="submit">登録</button>

    <p class="register-link">
        アカウントをお持ちの方は
        <a href="{{ url_for('login.login') }}">ログイン</a>
    </p>
</form>

{% endblock %}
