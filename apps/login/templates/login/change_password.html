{% extends "home/base.html" %}
{% block title %}パスワード変更{% endblock %}
{% block content %}

<link rel="stylesheet" href="{{ url_for('login.static', filename='style/login.css') }}">

<div class="login-panel">
    <h1>パスワード変更</h1>

    {% if success %}
    <p>パスワードを変更しました。</p>
    <p class="register-link"><a href="{{ url_for('home.index') }}">トップページへ戻る</a></p>
    {% else %}
        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}

    <form method="post" action="{{ url_for('login.change_password') }}">
        <div>
            <label for="new_password">新しいパスワード</label>
            <input type="password" id="new_password" name="new_password" autocomplete="new-password" required>
        </div>
        <div>
            <label for="confirm_password">新しいパスワード（確認）</label>
            <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
        </div>
        <button type="submit">変更する</button>
    </form>
    {% endif %}
</div>

<div class="back">
    <a href="{{ url_for('home.index') }}">← トップページに戻る</a>
</div>

{% endblock %}
