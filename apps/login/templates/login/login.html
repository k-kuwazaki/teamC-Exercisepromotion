{% extends "home/base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('login.static', filename='style/login.css') }}">

<div class="login-panel">
    <h1>ログイン</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        <div>
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email">
        </div>

        <div>
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password">
        </div>

        <button type="submit">ログイン</button>
    </form>
    <p class="register-link">
        アカウントをお持ちでない方は
        <a href="{{ url_for('home.register') }}">新規登録</a>
    </p>
</div>

{% endblock %}
{% block back_link %}
{% if session.user_id %}
<a href="{{ url_for('home.index') }}">← トップページに戻る</a>
{% else %}
<a href="{{ url_for('register.register') }}">新規登録はこちら</a>
{% endif %}
{% endblock %}
